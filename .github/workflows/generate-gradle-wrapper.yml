name: Generate Gradle Wrapper (one-time, TASK-002)

# Self-limiting: generates & commits gradlew/gradlew.bat/gradle-wrapper.jar if missing.
# Once the wrapper exists, this workflow becomes a no-op (and can be deleted).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            git commit -m "build: add Gradle wrapper 8.7 [TASK-002]"
            git push
          else
            echo "gradlew already present -- nothing to do."
          fi
