name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default packages ("tools platform-tools") minta paket legacy "tools" yang sudah
          # dihapus dari Android SDK repository Google — kalau dibiarkan default, step ini
          # gagal duluan sebelum sempat build apa-apa. Kosongkan di sini; Gradle/AGP sendiri
          # yang otomatis download platforms/build-tools yang dibutuhkan saat assembleDebug.
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          # TASK-013 (BUG-015): pastikan dependensi yang diunduh saat build
          # (termasuk detached lint configuration intellij-core dll.) ikut
          # ter-cache di Gradle User Home, sehingga run berikutnya tidak
          # bergantung pada network dl.google.com lagi.
          gradle-home-cache-includes: |
            caches
            notifications

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Run unit tests (characterization — SDD TASK-003)
        run: gradle test --no-daemon

      - name: Build release APK (unsigned)
        if: github.ref == 'refs/heads/main'
        # TASK-013 (BUG-015): lintVitalAnalyzeRelease pernah gagal "Read timed out"
        # mengunduh intellij-core dari dl.google.com — download transient, bukan
        # error kode. Retry hingga 3x; setelah run pertama sukses, deps lint sudah
        # ter-cache (Gradle User Home) dan retry hampir tidak pernah terpakai.
        run: |
          for attempt in 1 2 3; do
            if gradle assembleRelease --no-daemon; then
              exit 0
            fi
            echo "::warning::assembleRelease attempt $attempt failed — retrying"
            sleep 15
          done
          echo "::error::assembleRelease failed after 3 attempts"
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: naze-maps-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK (unsigned)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: naze-maps-release-unsigned
          path: app/build/outputs/apk/release/*.apk
