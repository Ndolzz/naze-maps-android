name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default packages ("tools platform-tools") minta paket legacy "tools" yang sudah
          # dihapus dari Android SDK repository Google — kalau dibiarkan default, step ini
          # gagal duluan sebelum sempat build apa-apa. Kosongkan di sini; Gradle/AGP sendiri
          # yang otomatis download platforms/build-tools yang dibutuhkan saat assembleDebug.
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        if: github.ref == 'refs/heads/main'
        run: gradle assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: naze-maps-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK (unsigned)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: naze-maps-release-unsigned
          path: app/build/outputs/apk/release/*.apk
